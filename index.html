<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tensor Base | AI & Tech Knowledge Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #1e293b;
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid #38bdf8;
        }
        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #f8fafc;
            letter-spacing: 2px;
        }
        header span {
            color: #38bdf8;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .article-card {
            background-color: #1e293b;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8;
            transition: transform 0.2s ease;
        }
        .article-card:hover {
            transform: translateX(5px);
        }
        .article-card h2 {
            margin-top: 0;
            color: #f8fafc;
        }
        .article-card p {
            color: #cbd5e1;
            font-size: 1rem;
        }
        .read-more {
            display: inline-block;
            margin-top: 10px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
        }
        .read-more:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>TENSOR<span>BASE</span></h1>
        <p>AI & Technology Knowledge Hub</p>
    </header>

    <div class="container">
        <div class="article-card">
            <h2>System Initialized</h2>
            <p>Welcome to Tensor Base. The repository is active. New data protocols and AI guides will be published here shortly.</p>
            <a href="#" class="read-more">Read System Logs →</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Tensor Base Project. All rights reserved.
    </footer>

</body>
</html>
